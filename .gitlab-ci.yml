# .gitlab-ci.yml

stages:
  - build
  - scan
  - push

variables:
  SHA_TAG: sha-${CI_COMMIT_SHORT_SHA}

default:
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com

before_script:
  - |
    # Assume role via OIDC
    export $(aws sts assume-role-with-web-identity \
      --role-arn arn:aws:iam::$AWS_OIDC_IAM_ROLE \
      --role-session-name gitlab-ci-$SHA_TAG \
      --web-identity-token $AWS_OIDC_TOKEN \
      --query 'Credentials.[AccessKeyId, SecretAccessKey, SessionToken]' \
      --output text | awk '{print "AWS_ACCESS_KEY_ID="$1"\nAWS_SECRET_ACCESS_KEY="$2"\nAWS_SESSION_TOKEN="$3}'
    )
  - |
    # Login to ECR
    aws ecr get-login-password --region $AWS_REGION | \
      docker login --username AWS --password-stdin \
      $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
  - |
    # Define IMAGE_BASE
    export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    export IMAGE_BASE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
    echo "IMAGE_BASE=$IMAGE_BASE" >> build.env
    echo "SHA_TAG=$SHA_TAG" >> build.env


build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|Staging)$/ || $CI_COMMIT_BRANCH =~ /^(main|Staging)$/"
  script:
    - source build.env
    - echo "Building $IMAGE_BASE:$SHA_TAG"
    - docker build -t $IMAGE_BASE:$SHA_TAG .
    - docker tag $IMAGE_BASE:$SHA_TAG $IMAGE_BASE:latest
    - |
      # save image to tar so it can be passed in the scan stage
      docker save $IMAGE_BASE:$SHA_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
      - build.env
    expire_in: 1 hour


scan:
  stage: scan
  image: aquasec/trivy:latest
  rules:
    - if: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|Staging)$/ || $CI_COMMIT_BRANCH =~ /^(main|Staging)$/"
  dependencies:
    - build
  script:
    - source build.env
    - echo "Scanning $IMAGE_BASE:$SHA_TAG"
    - |
      trivy image \
      --input image.tar \
      --exit-code 1 \
      --format json \
      --severity CRITICAL,HIGH \
      --output trivy-results.json
  artifacts:
    when: always
    reports:
      container_scanning: trivy-results.json
    expire_in: 7 days

push:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|Staging)$/ || $CI_COMMIT_BRANCH =~ /^(main|Staging)$/"
  dependencies:
    - build
  script:
    - source build.env
    - docker load -i image.tar
    - echo "Pushing $IMAGE_BASE:$SHA_TAG to ECR"
    - docker push $IMAGE_BASE:$SHA_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "Staging" ]; then
        echo "Pushing $IMAGE_BASE:latest"
        docker push $IMAGE_BASE:latest
      fi
    - echo "CI Complete - Image pushed successfully"
    - echo "SHA Tag: $SHA_TAG"
